<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かな入力タイピング練習</title>
<style>
:root{
  --bg:#f4f5f7; --fg:#1c1f26; --card:#ffffff; --muted:#6b7280;
  --accent:#2563eb; --accent2:#16a34a; --err:#dc2626; --key-bg:#eef0f4;
  --key-border:#d3d7e0; --key-shift:#94a3b8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --fg:#e8eaf0; --card:#1f232c; --muted:#9aa2b1;
    --key-bg:#262b36; --key-border:#3a4152; --key-shift:#5b6577;
  }
}
:root[data-theme="dark"]{
  --bg:#14161c; --fg:#e8eaf0; --card:#1f232c; --muted:#9aa2b1;
  --key-bg:#262b36; --key-border:#3a4152; --key-shift:#5b6577;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;overflow-x:hidden}
.wrap{max-width:820px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.2rem;text-align:center;margin:6px 0 14px}
.stats{display:flex;justify-content:center;gap:18px;font-size:.85rem;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.stats b{color:var(--fg)}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px}
.progress{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:8px}
.word{font-size:2.1rem;text-align:center;letter-spacing:2px;line-height:1.4;min-height:2.6em;word-break:break-all}
.ch{color:var(--muted)}
.ch.done{color:var(--accent2)}
.ch.cur{color:var(--accent);border-bottom:3px solid var(--accent);padding-bottom:2px}
.startbar{text-align:center;margin-bottom:10px}
button{font-size:1rem;padding:10px 22px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer}
button:active{opacity:.8}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;user-select:none}
.row{display:flex;gap:5px}
.key{background:var(--key-bg);border:1px solid var(--key-border);border-radius:8px;
  min-width:40px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.95rem;transition:background .08s,transform .08s;position:relative;padding:2px}
.key .sh{font-size:.6rem;color:var(--key-shift);position:absolute;top:3px;right:5px}
.key.active{background:var(--accent);color:#fff;transform:scale(1.08);border-color:var(--accent)}
.key.shiftkey{min-width:70px;font-size:.75rem;color:var(--muted)}
.key.shiftkey.active{background:var(--key-shift);color:#fff}
.key.wrong{background:var(--err);color:#fff}
.legend{text-align:center;font-size:.75rem;color:var(--muted);margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.result{background:var(--card);border-radius:16px;padding:26px;max-width:340px;text-align:center}
.result h2{margin-top:0}
.result p{margin:6px 0;color:var(--muted)}
.result b{color:var(--fg);font-size:1.1rem}
@media (max-width:600px){
  .word{font-size:1.5rem}
  .key{min-width:26px;height:40px;font-size:.75rem}
  .key.shiftkey{min-width:46px}
  .row{gap:3px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>⌨️ かな入力タイピング練習(JISかな配列)</h1>
<div class="stats">
  <span>時間: <b id="time">0.0</b>秒</span>
  <span>ミス: <b id="miss">0</b></span>
  <span>自己ベストCPM: <b id="best">-</b></span>
</div>
<div class="card">
  <div class="progress" id="progress">スタートを押して開始してください</div>
  <div class="word" id="word"></div>
  <div class="startbar"><button id="startBtn">スタート</button></div>
</div>
<div class="card">
  <div class="kb" id="kb"></div>
  <div class="legend">青いキーが次に押すキーです。濁点(゛)・半濁点(゜)が光ったら続けて押してください。</div>
</div>
</div>
<div class="overlay" id="overlay"><div class="result">
  <h2>結果</h2>
  <p>タイム: <b id="rTime"></b> 秒</p>
  <p>ミス回数: <b id="rMiss"></b></p>
  <p>CPM(1分あたりの文字数): <b id="rCpm"></b></p>
  <button id="againBtn">もう一度</button>
</div></div>
<script>
const BASE = {あ:'Digit3',い:'KeyE',う:'Digit4',え:'Digit5',お:'Digit6',
 か:'KeyT',き:'KeyG',く:'KeyH',け:'Quote',こ:'KeyB',
 さ:'KeyX',し:'KeyD',す:'KeyR',せ:'KeyP',そ:'KeyC',
 た:'KeyQ',ち:'KeyA',つ:'KeyZ',て:'KeyW',と:'KeyS',
 な:'KeyU',に:'KeyI',ぬ:'Digit1',ね:'Comma',の:'KeyK',
 は:'KeyF',ひ:'KeyV',ふ:'Digit2',へ:'Equal',ほ:'Minus',
 ま:'KeyJ',み:'KeyN',む:'Backslash',め:'Slash',も:'KeyM',
 や:'Digit7',ゆ:'Digit8',よ:'Digit9',
 ら:'KeyO',り:'KeyL',る:'Period',れ:'Semicolon',ろ:'IntlRo',
 わ:'Digit0',ん:'KeyY','ー':'IntlYen'};
const SHIFTBASE = {を:'Digit0',ぁ:'Digit3',ぃ:'KeyE',ぅ:'Digit4',ぇ:'Digit5',ぉ:'Digit6',
 ゃ:'Digit7',ゅ:'Digit8',ょ:'Digit9',っ:'KeyZ','、':'Comma','。':'Period','・':'Slash'};
const KEYS = {};
for (const k in BASE) KEYS[k] = [{code:BASE[k]}];
for (const k in SHIFTBASE) KEYS[k] = [{code:SHIFTBASE[k],shift:true}];
const DAKU = {か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',
 た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ'};
for (const b in DAKU) KEYS[DAKU[b]] = [...KEYS[b], {code:'BracketLeft'}];
const HANDAKU = {は:'ぱ',ひ:'ぴ',ふ:'ぷ',へ:'ぺ',ほ:'ぽ'};
for (const b in HANDAKU) KEYS[HANDAKU[b]] = [...KEYS[b], {code:'BracketRight'}];

const ROWS = [
 [['Digit1','ぬ'],['Digit2','ふ'],['Digit3','あ','ぁ'],['Digit4','う','ぅ'],['Digit5','え','ぇ'],['Digit6','お','ぉ'],['Digit7','や','ゃ'],['Digit8','ゆ','ゅ'],['Digit9','よ','ょ'],['Digit0','わ','を'],['Minus','ほ'],['Equal','へ'],['IntlYen','ー']],
 [['KeyQ','た'],['KeyW','て'],['KeyE','い','ぃ'],['KeyR','す'],['KeyT','か'],['KeyY','ん'],['KeyU','な'],['KeyI','に'],['KeyO','ら'],['KeyP','せ'],['BracketLeft','゛','「'],['BracketRight','゜','」'],['Backslash','む']],
 [['KeyA','ち'],['KeyS','と'],['KeyD','し'],['KeyF','は'],['KeyG','き'],['KeyH','く'],['KeyJ','ま'],['KeyK','の'],['KeyL','り'],['Semicolon','れ'],['Quote','け']],
 [['IntlRo','ろ'],['KeyZ','つ','っ'],['KeyX','さ'],['KeyC','そ'],['KeyV','ひ'],['KeyB','こ'],['KeyN','み'],['KeyM','も'],['Comma','ね','、'],['Period','る','。'],['Slash','め','・']]
];
const WORDS = ["ねこ","いぬ","さくら","がっこう","せんせい","ともだち","おはよう","ありがとう",
 "こんにちは","つくえ","でんしゃ","りんご","ぱん","きっぷ","びょういん","おかあさん","おとうさん",
 "じてんしゃ","でんわ","たんじょうび","きょうしつ","しゃしん","びょうき","がっき","ちゃいろ",
 "りゅうがく","しゅくだい","にゅうがく","おんがく","こうえん"];

const kbEl=document.getElementById('kb'), wordEl=document.getElementById('word'),
 progEl=document.getElementById('progress'), timeEl=document.getElementById('time'),
 missEl=document.getElementById('miss'), bestEl=document.getElementById('best'),
 overlay=document.getElementById('overlay');

const keyEls={};
ROWS.forEach(row=>{
  const rowEl=document.createElement('div'); rowEl.className='row';
  row.forEach(([code,main,sh])=>{
    const k=document.createElement('div'); k.className='key'; k.dataset.code=code;
    k.innerHTML='<span>'+main+'</span>'+(sh?'<span class="sh">'+sh+'</span>':'');
    rowEl.appendChild(k); keyEls[code]=k;
  });
  kbEl.appendChild(rowEl);
});
['ShiftLeft','ShiftRight'].forEach(c=>{
  const k=document.createElement('div'); k.className='key shiftkey'; k.dataset.code=c;
  k.textContent='Shift'; keyEls[c]=k;
});

let words=[], wIdx=0, steps=[], ptr=0, misses=0, startTime=null, timerId=null, totalChars=0, running=false;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildSteps(word){
  const arr=[];
  [...word].forEach((ch,ci)=>{
    const s=KEYS[ch]; if(!s) return;
    s.forEach(st=>arr.push({...st, charIndex:ci}));
  });
  return arr;
}

function renderWord(){
  const word=words[wIdx];
  const curCharIndex = steps.length ? steps[Math.min(ptr,steps.length-1)].charIndex : -1;
  const doneUpTo = ptr>0 ? steps[ptr-1].charIndex : -1;
  wordEl.innerHTML=[...word].map((ch,i)=>{
    let cls='ch';
    if(i<=doneUpTo && (ptr>=steps.length || i<curCharIndex)) cls+=' done';
    else if(i===curCharIndex) cls+=' cur';
    return '<span class="'+cls+'">'+ch+'</span>';
  }).join('');
  progEl.textContent='単語 '+(wIdx+1)+' / '+words.length;
}

function clearKeyStates(){
  Object.values(keyEls).forEach(k=>k.classList.remove('active','wrong'));
}
function highlightNext(){
  clearKeyStates();
  if(ptr>=steps.length) return;
  const st=steps[ptr];
  if(keyEls[st.code]) keyEls[st.code].classList.add('active');
  if(st.shift){ keyEls.ShiftLeft.classList.add('active'); keyEls.ShiftRight.classList.add('active'); }
}

function startRound(){
  words=shuffle(WORDS).slice(0,10);
  wIdx=0; misses=0; totalChars=0; startTime=null; running=true;
  missEl.textContent='0'; timeEl.textContent='0.0';
  loadWord();
  overlay.classList.remove('show');
  document.getElementById('startBtn').textContent='リスタート';
  if(timerId) clearInterval(timerId);
  timerId=setInterval(()=>{ if(startTime) timeEl.textContent=((Date.now()-startTime)/1000).toFixed(1); },100);
}
function loadWord(){
  steps=buildSteps(words[wIdx]); ptr=0;
  renderWord(); highlightNext();
}
function nextWord(){
  totalChars+=words[wIdx].length;
  wIdx++;
  if(wIdx>=words.length){ finishRound(); return; }
  loadWord();
}
function finishRound(){
  running=false; clearInterval(timerId); clearKeyStates();
  const t=(Date.now()-startTime)/1000;
  const cpm= t>0 ? Math.round(totalChars/(t/60)) : 0;
  document.getElementById('rTime').textContent=t.toFixed(1);
  document.getElementById('rMiss').textContent=misses;
  document.getElementById('rCpm').textContent=cpm;
  try{
    const best=parseInt(localStorage.getItem('kanaTypingBestCPM')||'0');
    if(cpm>best){ localStorage.setItem('kanaTypingBestCPM',cpm); }
    bestEl.textContent=Math.max(best,cpm);
  }catch(e){}
  overlay.classList.add('show');
}
try{ const b=localStorage.getItem('kanaTypingBestCPM'); if(b) bestEl.textContent=b; }catch(e){}

window.addEventListener('keydown', e=>{
  if(['ShiftLeft','ShiftRight'].includes(e.code)){ keyEls[e.code]&&keyEls[e.code].classList.add('active'); }
  if(!running || e.repeat) return;
  const code=e.code, expect=steps[ptr];
  if(!expect) return;
  if(code===expect.code && !!e.shiftKey===!!expect.shift){
    e.preventDefault();
    if(!startTime) startTime=Date.now();
    ptr++;
    if(ptr>=steps.length){ nextWord(); } else { renderWord(); highlightNext(); }
  } else if(!['ShiftLeft','ShiftRight'].includes(code)){
    e.preventDefault();
    misses++; missEl.textContent=misses;
    if(keyEls[code]){ keyEls[code].classList.add('wrong'); setTimeout(()=>keyEls[code].classList.remove('wrong'),200); }
  }
});
window.addEventListener('keyup', e=>{
  if(['ShiftLeft','ShiftRight'].includes(e.code) && !steps[ptr]?.shift){ keyEls[e.code]&&keyEls[e.code].classList.remove('active'); }
});

document.getElementById('startBtn').addEventListener('click', startRound);
document.getElementById('againBtn').addEventListener('click', startRound);
</script>
</body>
</html>
